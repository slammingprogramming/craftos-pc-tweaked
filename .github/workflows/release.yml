# Based on the release workflow of CraftOS-PC 2, Copyright (c) 2019-2024 JackMacWindows (MIT License).
#
# Pushing a version tag (v*) builds every platform with the CI workflow, creates
# the GitHub Release if it does not exist yet, and attaches the packaged
# results plus SHA-256 hashes to it.
#
#   git tag v2.8.4-tweaked.1 && git push origin v2.8.4-tweaked.1
#
# This deliberately does not trigger on the "release published" event: releases
# created with the default GITHUB_TOKEN (by this or any other workflow) do not
# start new workflow runs, so a tag push is the reliable trigger. A run can also
# be started by hand from the Actions tab by choosing the tag as the ref.
#
# Not handled here (yet): macOS/iOS/Android builds, Windows installers, and
# distro packages. See TODO.md.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ROM_REPO: https://github.com/MCJack123/craftos2-rom
  ROM_REF: master

jobs:
  build:
    name: Build
    if: ${{ github.ref_type == 'tag' }}
    uses: ./.github/workflows/main.yml

  package:
    name: Package and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y patchelf zip
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: CraftOS-Tweaked-*
        path: artifacts
    - name: Download ROM
      run: git clone --depth 1 --branch "$ROM_REF" "$ROM_REPO" rom
    - name: Write source notice
      run: |
        mkdir -p stage-common
        SUBMODULE="$(git ls-tree HEAD craftos2-lua | awk '{print $3}')"
        cat > stage-common/SOURCE.txt <<EOF
        CraftOS-Tweaked ${TAG}

        This program is licensed under the GNU Affero General Public License,
        version 3 or later. The complete corresponding source code for this
        build is available at:

          ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}

        It also needs the modified Lua library from the craftos2-lua submodule,
        revision ${SUBMODULE}:

          https://github.com/MCJack123/craftos2-lua

        Run "git clone --recursive" to fetch both. The CraftOS ROM files in this
        package come from ${ROM_REPO} and have their own license.
        EOF
        cp LICENSE AUTHORS.md stage-common/
    - name: Package Windows builds
      run: |
        for arch in x64 arm64; do
          case $arch in x64) name=Win64 ;; arm64) name=WinARM64 ;; esac
          stage="stage-windows-$arch"
          mkdir "$stage"
          cp -R artifacts/CraftOS-Tweaked-windows-$arch/. "$stage/"
          cp rom/bios.lua rom/hdfont.bmp "$stage/"
          cp -R rom/rom rom/debug "$stage/"
          cp stage-common/* "$stage/"
          (cd "$stage" && zip -qr "../CraftOS-Tweaked-Portable-$name.zip" .)
        done
    - name: Package Linux build
      run: |
        stage=CraftOS-Tweaked-linux-x86_64
        mkdir -p "$stage/bin" "$stage/lib" "$stage/share/craftos"
        cp artifacts/CraftOS-Tweaked-linux-x64/craftos-tweaked "$stage/bin/craftos-tweaked"
        cp artifacts/CraftOS-Tweaked-linux-x64/craftos2-lua/src/liblua.so "$stage/lib/libcraftos2-lua.so"
        chmod +x "$stage/bin/craftos-tweaked"
        # The build links the Lua library by relative path; make it relocatable
        patchelf --replace-needed craftos2-lua/src/liblua.so libcraftos2-lua.so "$stage/bin/craftos-tweaked"
        patchelf --set-rpath '$ORIGIN/../lib' "$stage/bin/craftos-tweaked"
        readelf -d "$stage/bin/craftos-tweaked" | grep -E 'NEEDED|RPATH|RUNPATH'
        if readelf -d "$stage/bin/craftos-tweaked" | grep -q 'craftos2-lua/src'; then
          echo "::error::Lua library path was not rewritten"; exit 1
        fi
        cp rom/bios.lua rom/hdfont.bmp "$stage/share/craftos/"
        cp -R rom/rom rom/debug "$stage/share/craftos/"
        cp stage-common/* "$stage/"
        cat > "$stage/craftos-tweaked" <<'EOF'
        #!/bin/sh
        DIR="$(dirname "$(readlink -f "$0")")"
        exec "$DIR/bin/craftos-tweaked" --rom "$DIR/share/craftos" "$@"
        EOF
        chmod +x "$stage/craftos-tweaked"
        cat > "$stage/README-linux.txt" <<'EOF'
        Run ./craftos-tweaked to start CraftOS-Tweaked.

        This build was made on Ubuntu (ubuntu-latest) and uses system libraries.
        On Debian/Ubuntu you can install everything it needs with:

          sudo apt install libsdl2-dev libsdl2-mixer-dev libhpdf-dev libpng++-dev libwebp-dev libpoco-dev libncurses5-dev

        On other distributions, install the equivalent SDL2, SDL2_mixer, libharu,
        libpng, libwebp, Poco and ncurses libraries, or build from source.
        EOF
        tar -czf CraftOS-Tweaked-Linux-x86_64.tar.gz "$stage"
    - name: Generate hashes
      run: sha256sum CraftOS-Tweaked-*.zip CraftOS-Tweaked-*.tar.gz | tee sha256-hashes.txt
    - name: Create release if needed
      run: |
        PRERELEASE=
        case "$TAG" in *-*) PRERELEASE=--prerelease ;; esac
        if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          gh release create "$TAG" --repo "${{ github.repository }}" --verify-tag \
            --title "CraftOS-Tweaked $TAG" --generate-notes $PRERELEASE
        fi
    - name: Upload release assets
      run: |
        gh release upload "$TAG" \
          CraftOS-Tweaked-Portable-Win64.zip \
          CraftOS-Tweaked-Portable-WinARM64.zip \
          CraftOS-Tweaked-Linux-x86_64.tar.gz \
          sha256-hashes.txt \
          --clobber --repo "${{ github.repository }}"
