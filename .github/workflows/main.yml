name: CI

# SPDX-License-Identifier: AGPL-3.0-or-later
# Copyright (c) 2026 slammingprogramming
# Based on the CI workflow of CraftOS-PC 2, Copyright (c) 2019-2024 JackMacWindows (MIT License).
#
# Builds and tests CraftOS-Tweaked on GitHub-hosted runners. This workflow is
# also called by release.yml (workflow_call) so that release binaries come from
# exactly the same build steps as CI.

on:
  push:
    branches-ignore:
      - rom-sync # machine-made branch of ROM updates (see sync-roms.yml); open a pull request to test it
    paths:
      - "roms/**"
      - "roms-overlay/**"
      - "tools/**"
      - "patches/**"
      - "src/**"
      - "api/**"
      - ".github/workflows/*"
      - "craftos2-lua/**"
      - "craftos2-lua"
      - "resources/CraftOSTest.lua"
      - "resources/CCT-Test-Bootstrap.lua"
      - "resources/packStandaloneROM.js"
      - "configure.ac"
      - "Makefile.in"
      - "vcpkg.json"
      - "CraftOS-Tweaked.sln"
      - "CraftOS-Tweaked.vcxproj"
      - "examples/ccemux.vcxproj"
  pull_request:
    paths:
      - "roms/**"
      - "roms-overlay/**"
      - "tools/**"
      - "patches/**"
      - "src/**"
      - "api/**"
      - ".github/workflows/*"
      - "craftos2-lua/**"
      - "craftos2-lua"
      - "resources/CraftOSTest.lua"
      - "configure.ac"
      - "Makefile.in"
      - "vcpkg.json"
      - "CraftOS-Tweaked.sln"
      - "CraftOS-Tweaked.vcxproj"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The ROMs the emulator runs live in roms/ (see roms/README.md). Packages needed for a build with all optional features:
  LINUX_PACKAGES: libsdl2-dev libsdl2-mixer-dev libhpdf-dev libpng++-dev libwebp-dev libpoco-dev libncurses5-dev

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all features
            id: full
            packages: ""
            configure: ""
            standalone: false
          - name: no optional features
            id: basic
            packages: ""
            configure: --without-ncurses --without-png --without-sdl_mixer --with-html
            standalone: false
          - name: standalone ROM
            id: standalone
            packages: nodejs
            configure: --with-standalone_rom=roms/mc-1.20.x/fs_standalone.cpp
            standalone: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Patch the modified Lua
      shell: bash
      run: tools/apply-lua-patches.sh
    - name: Install dependencies
      run: |
        if [ "${{ matrix.id }}" = "basic" ]; then
          PACKAGES="libsdl2-dev libpoco-dev"
        else
          PACKAGES="$LINUX_PACKAGES ${{ matrix.packages }}"
        fi
        sudo apt-get update
        sudo apt-get install -y $PACKAGES
    - name: Build standalone ROM
      if: ${{ matrix.standalone }}
      run: |
        cd roms/mc-1.20.x
        node ../../resources/packStandaloneROM.js
    - name: Build Lua
      run: make -C craftos2-lua linux -j"$(nproc)"
    - name: Build CraftOS-Tweaked
      run: |
        CFLAGS=-Wall ./configure ${{ matrix.configure }}
        make -j"$(nproc)"
    - name: Run CraftOSTest
      run: ./craftos-tweaked --headless --script resources/CraftOSTest.lua || echo $? > "$RUNNER_TEMP/retval"
      id: test
      continue-on-error: true
      timeout-minutes: 2
    - name: Show logs
      run: |
        cat computercraft/computer/0/CraftOSTest.log
        if [ "${{ steps.test.outcome }}" != "success" ]; then
          echo "::warning::CraftOSTest did not finish (timed out or was cancelled)"
        fi
        if [ -e "$RUNNER_TEMP/retval" ]; then exit "$(cat "$RUNNER_TEMP/retval")"; fi
    - name: Test crash log
      if: ${{ matrix.id == 'full' }}
      timeout-minutes: 2
      run: |
        # A crash must leave a log on disk (nothing is uploaded), and the next start must point to it.
        rm -rf computercraft/crash-logs
        echo 'while true do sleep(0.1) end' > "$RUNNER_TEMP/loop.lua"
        echo 'os.shutdown()' > "$RUNNER_TEMP/exit.lua"
        ./craftos-tweaked --headless --script "$RUNNER_TEMP/loop.lua" &
        PID=$!
        sleep 5
        kill -SEGV $PID
        sleep 2
        kill -9 $PID || true
        wait $PID || true
        ls -l computercraft/crash-logs/
        cat computercraft/crash-logs/crash-*.log
        grep -q "^Reason: Segmentation fault" computercraft/crash-logs/crash-*.log
        grep -q "^Backtrace:" computercraft/crash-logs/crash-*.log
        ./craftos-tweaked --headless --script "$RUNNER_TEMP/exit.lua" 2>&1 | tee "$RUNNER_TEMP/second-run.txt"
        grep -q "issues/new?template=crash_report.yml" "$RUNNER_TEMP/second-run.txt"
        ls computercraft/crash-logs/*.seen.log
    - name: Upload binary
      if: ${{ matrix.id == 'full' }}
      uses: actions/upload-artifact@v4
      with:
        name: CraftOS-Tweaked-linux-x64
        path: |
          craftos-tweaked
          craftos2-lua/src/liblua.so
        if-no-files-found: error

  configure:
    name: configure is up to date
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Regenerate configure
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf
        autoconf
    - name: Check for differences
      run: |
        if ! git diff --exit-code --stat configure; then
          echo "::error file=configure::configure is out of date with configure.ac. Run the 'Regenerate configure' workflow (Actions tab) or run 'autoconf' and commit the result."
          exit 1
        fi

  cct-tests:
    # Runs CC: Tweaked's own test suite (the one its Java build runs) against the emulator, using the CC: Tweaked
    # source that the ROM in roms/ was imported from. tools/cct/baseline/<id>.txt records how far the emulator
    # gets today; the job fails if a spec gets worse and tells you when one gets better.
    name: CC Tweaked tests (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id: [mc-1.20.x, mc-26.3]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Patch the modified Lua
      shell: bash
      run: tools/apply-lua-patches.sh
    - name: Get the CC Tweaked sources that match the ROM
      run: |
        COMMIT="$(python3 -c "import json;print(json.load(open('roms/${{ matrix.id }}/rom-info.json'))['upstream_commit'])")"
        git init -q ../CC-Tweaked
        cd ../CC-Tweaked
        git remote add origin https://github.com/cc-tweaked/CC-Tweaked
        git fetch -q --depth 1 origin "$COMMIT"
        git checkout -q FETCH_HEAD
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $LINUX_PACKAGES xvfb  # xvfb: a virtual screen, because the monitor specs need a window
    - name: Build Lua
      run: make -C craftos2-lua linux -j"$(nproc)"
    - name: Build CraftOS-Tweaked
      run: |
        CFLAGS=-Wall ./configure
        make -j"$(nproc)"
    - name: Run the CC Tweaked test suite
      run: JOBS=4 tools/cct/run-specs.sh ./craftos-tweaked "${{ matrix.id }}" ../CC-Tweaked cct-report.txt || true
    - name: Compare with the baseline
      run: python3 tools/cct/compare.py "tools/cct/baseline/${{ matrix.id }}.txt" cct-report.txt
    - name: Upload the report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cct-report-${{ matrix.id }}
        path: cct-report.txt
        if-no-files-found: ignore

  windows-x64:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Patch the modified Lua
      shell: bash
      run: tools/apply-lua-patches.sh
    - name: Restore vcpkg cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: baf57686c0ec86cbf2e4c055ea09cee710280cc6
    - name: Set up binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('vcpkg*.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-binary-cache-
    - name: Prepare environment
      run: |
        mkdir x64\ReleaseC
        mkdir x64\Release
        & $Env:VCPKG_ROOT\vcpkg integrate install
        ((Get-Content -path "$Env:VCPKG_ROOT\ports\poco\portfile.cmake") -replace "VCPKG_TARGET_IS_WINDOWS", "false") -replace "lib/cmake/Poco", "cmake" | Set-Content -Path "$Env:VCPKG_ROOT\ports\poco\portfile.cmake"
    - name: Build CraftOS-Tweaked
      run: |
        function Invoke-Environment {
            param
            (
                # Any cmd shell command, normally a configuration batch file.
                [Parameter(Mandatory=$true)]
                [string] $Command
            )

            $Command = "`"" + $Command + "`""
            cmd /c "$Command > nul 2>&1 && set" | . { process {
                if ($_ -match '^([^=]+)=(.*)') {
                    [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
                }
            }}

        }

        Invoke-Environment "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        $tag = git rev-parse --short HEAD
        Set-Item ENV:ExternalCompilerOptions /DCRAFTOSPC_COMMIT='\"'$tag'\" '
        msbuild "CraftOS-Tweaked.sln" /p:Configuration=ReleaseC
        msbuild "CraftOS-Tweaked.sln" /p:Configuration=Release
        New-Item -ItemType Directory dist, symbols | Out-Null
        # vcpkg copies the runtime DLLs next to the executable
        Copy-Item x64\Release\*.dll dist\ -ErrorAction SilentlyContinue
        Copy-Item craftos2-lua\src\lua52.dll dist\ -Force
        Copy-Item x64\Release\CraftOS-Tweaked.exe dist\CraftOS-Tweaked.exe
        Copy-Item x64\ReleaseC\CraftOS-Tweaked.exe dist\CraftOS-Tweaked_console.exe
        Copy-Item x64\Release\CraftOS-Tweaked.pdb symbols\CraftOS-Tweaked.pdb
        Copy-Item x64\ReleaseC\CraftOS-Tweaked.pdb symbols\CraftOS-Tweaked_console.pdb
        Copy-Item craftos2-lua\src\lua52.pdb symbols\lua52.pdb
        Get-ChildItem dist | Format-Table Name, Length
    - name: Run CraftOSTest
      run: |
        x64\ReleaseC\CraftOS-Tweaked --headless --script resources\CraftOSTest.lua --rom "$PWD\roms"
        echo $LASTEXITCODE > retval.txt
      continue-on-error: true
      timeout-minutes: 2
    - name: Show logs
      run: |
        type "x64\ReleaseC\computercraft\computer\0\CraftOSTest.log"
        $code = Get-Content .\retval.txt
        if ( $code -ne 0 ) { exit $code }
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CraftOS-Tweaked-windows-x64
        path: dist/
        if-no-files-found: error
    - name: Upload artifact symbols
      uses: actions/upload-artifact@v4
      with:
        name: CraftOS-Tweaked-windows-x64-symbols
        path: symbols/
        if-no-files-found: error
    - name: Save binary cache
      # Save the compiled dependencies even if the build failed, so a retry doesn't rebuild them all
      if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('vcpkg*.json') }}

  windows-arm64:
    name: Windows (ARM64)
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Patch the modified Lua
      shell: bash
      run: tools/apply-lua-patches.sh
    - name: Restore vcpkg cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 1b4a65242adfd65a82b1d1a6f31f1accdfe09af9
    - name: Set up binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-binary-cache-arm-${{ hashFiles('vcpkg*.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-binary-cache-arm-
    - name: Prepare environment
      run: |
        mkdir ARM64\ReleaseC
        mkdir ARM64\Release
        & $Env:VCPKG_ROOT\vcpkg integrate install
        ((Get-Content -path "$Env:VCPKG_ROOT\ports\poco\portfile.cmake") -replace "VCPKG_TARGET_IS_WINDOWS", "false") -replace "lib/cmake/Poco", "cmake" | Set-Content -Path "$Env:VCPKG_ROOT\ports\poco\portfile.cmake"
    - name: Build CraftOS-Tweaked
      run: |
        function Invoke-Environment {
            param
            (
                # Any cmd shell command, normally a configuration batch file.
                [Parameter(Mandatory=$true)]
                [string] $Command
            )

            $Command = "`"" + $Command + "`""
            cmd /c "$Command > nul 2>&1 && set" | . { process {
                if ($_ -match '^([^=]+)=(.*)') {
                    [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
                }
            }}

        }

        Invoke-Environment "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsamd64_arm64.bat"
        $tag = git rev-parse --short HEAD
        Set-Item ENV:ExternalCompilerOptions /DCRAFTOSPC_COMMIT='\"'$tag'\" '
        msbuild "CraftOS-Tweaked.sln" /p:Configuration=ReleaseC /p:Platform=ARM64 /p:VcpkgEnableManifest=true
        msbuild "CraftOS-Tweaked.sln" /p:Configuration=Release /p:Platform=ARM64 /p:VcpkgEnableManifest=true
        New-Item -ItemType Directory dist, symbols | Out-Null
        Copy-Item ARM64\Release\*.dll dist\ -ErrorAction SilentlyContinue
        Copy-Item craftos2-lua\src\lua52.dll dist\ -Force
        Copy-Item ARM64\Release\CraftOS-Tweaked.exe dist\CraftOS-Tweaked.exe
        Copy-Item ARM64\ReleaseC\CraftOS-Tweaked.exe dist\CraftOS-Tweaked_console.exe
        Copy-Item ARM64\Release\CraftOS-Tweaked.pdb symbols\CraftOS-Tweaked.pdb
        Copy-Item ARM64\ReleaseC\CraftOS-Tweaked.pdb symbols\CraftOS-Tweaked_console.pdb
        Copy-Item craftos2-lua\src\lua52.pdb symbols\lua52.pdb
        Get-ChildItem dist | Format-Table Name, Length
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CraftOS-Tweaked-windows-arm64
        path: dist/
        if-no-files-found: error
    - name: Upload artifact symbols
      uses: actions/upload-artifact@v4
      with:
        name: CraftOS-Tweaked-windows-arm64-symbols
        path: symbols/
        if-no-files-found: error
    - name: Save binary cache
      # Save the compiled dependencies even if the build failed, so a retry doesn't rebuild them all
      if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-binary-cache-arm-${{ hashFiles('vcpkg*.json') }}
