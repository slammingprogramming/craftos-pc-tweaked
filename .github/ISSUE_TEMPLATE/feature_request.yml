name: Feature request
description: Suggest an idea for CraftOS-Tweaked.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and why it is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: dropdown
    id: cct
    attributes:
      label: Does CC Tweaked have this?
      options:
        - Yes, CC Tweaked has it
        - No, it is specific to CraftOS-Tweaked
        - Not sure
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, mock-ups, links.
